<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuleiro de Times & Dados - Multiplayer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎲 Tabuleiro de Times & Dados</h1>
        
        <!-- Tela de Entrada na Mesa -->
        <div id="sala-container">
            <input type="text" id="nome-jogador" placeholder="Seu Nome (Ex: Kakaroto)">
            <input type="text" id="codigo-sala" placeholder="Código da Sala (Ex: 12345)">
            <select id="select-time">
                <option value="Corinthians">Corinthians</option>
                <option value="Palmeiras">Palmeiras</option>
                <option value="Flamengo">Flamengo</option>
                <option value="Grêmio">Grêmio</option>
            </select>
            <button onclick="entrarNaMesa()">Entrar na Mesa</button>
        </div>

        <!-- Tela do Jogo / Tabuleiro -->
        <div id="jogo-container" style="display: none;">
            <h2>Mesa: <span id="span-sala"></span></h2>
            
            <!-- Painel com os Bonequinhos / Usuários Online -->
            <div class="painel-jogadores">
                <h3>👥 Jogadores na Mesa:</h3>
                <ul id="lista-jogadores"></ul>
            </div>

            <p id="status-jogo">Aguardando o anfitrião rodar os dados...</p>

            <!-- Área dos 3 Dados Globais (Sorteados pelo Sistema) -->
            <div class="dados-container-geral">
                <div class="grupo-dado">
                    <span class="legenda-dado">Time 1</span>
                    <div class="dado" id="dado-t1">?</div>
                </div>
                <div class="grupo-dado">
                    <span class="legenda-dado">Time 2</span>
                    <div class="dado" id="dado-t2">?</div>
                </div>
                <div class="grupo-dado">
                    <span class="legenda-dado">Número (1-6)</span>
                    <div class="dado numero" id="dado-num">?</div>
                </div>
            </div>

            <!-- Botão Global para Sortear os Dados para Todos -->
            <button id="btn-rodar-global" onclick="rodarDadosGlobais()">🎲 Sortear Dados Globais</button>

            <!-- O Tabuleiro Visual Estilo Mesa -->
            <div class="tabuleiro-mesa">
                <div class="coluna-numeros">
                    <div class="num-celula" id="cel-1">1</div>
                    <div class="num-celula" id="cel-2">2</div>
                    <div class="num-celula" id="cel-3">3</div>
                    <div class="num-celula" id="cel-4">4</div>
                    <div class="num-celula" id="cel-5">5</div>
                    <div class="num-celula" id="cel-6">6</div>
                </div>
                <div class="campos-times">
                    <div class="time-box cor-corinthians">Corinthians</div>
                    <div class="time-box cor-palmeiras">Palmeiras</div>
                    <div class="time-box cor-flamengo">Flamengo</div>
                    <div class="time-box cor-gremio">Grêmio</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts do Firebase (SDK Modular) -->
    <script type="module" src="game.js"></script>
</body>
</html>
