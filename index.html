<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bozo em Equipe Multiplayer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎲 Bozo em Equipe</h1>
        
        <div id="sala-container">
            <input type="text" id="nome-jogador" placeholder="Seu Nome">
            <input type="text" id="codigo-sala" placeholder="Código da Sala">
            <button onclick="entrarSala()">Entrar na Sala</button>
        </div>

        <div id="jogo-container" style="display: none;">
            <h2>Sala: <span id="span-sala"></span></h2>
            <p id="vez-jogador">Aguardando início...</p>

            <!-- Área dos Dados -->
            <div class="dados-area">
                <div class="dado" onclick="toggleSegurar(0)">1</div>
                <div class="dado" onclick="toggleSegurar(1)">2</div>
                <div class="dado" onclick="toggleSegurar(2)">3</div>
                <div class="dado" onclick="toggleSegurar(3)">4</div>
                <div class="dado" onclick="toggleSegurar(4)">5</div>
            </div>
            
            <button id="btn-rolar" onclick="rolarDados()">Rolar Dados (3)</button>

            <!-- Placar da Equipe -->
            <div class="placar">
                <h3>Placar da Partida</h3>
                <div id="tabela-placar"></div>
            </div>
        </div>
    </div>

    <!-- Importa o Socket.io para comunicação em tempo real -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
